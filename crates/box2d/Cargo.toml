[package]
name = "box2d"
version = "0.1.0"
edition = "2021"
description = "Faithful port of the Box2D 2.0.x variant embedded in Happy Wheels (f64, same solver order)"

[dependencies]
# fdlibm port: V8's Math.sin/cos/atan2 are fdlibm, the platform libm rounds differently in the last bit
libm = "0.2"

[dev-dependencies]
serde_json = "1"
