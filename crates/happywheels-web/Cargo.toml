[package]
name = "happywheels-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"
happywheels-core = { path = "../happywheels-core" }
image = "0.25"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
