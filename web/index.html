<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Wheels Rust — browser preview</title>
  <style>
    body { margin: 0; background: #242424; color: white; font: 16px system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 1rem; }
    canvas { display: block; width: 100%; aspect-ratio: 9 / 5; background: #111; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 1rem 0; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Happy Wheels Rust — browser preview</h1>
    <canvas id="game" width="1800" height="1000" tabindex="0" aria-label="Game screen"></canvas>
    <div class="controls">
      <label>Load level XML <input id="level" type="file" accept=".xml,.txt,text/xml"></label>
      <label>Character <select id="character"></select></label>
      <label>Blood <select id="blood"><option value="0">Off</option><option value="1" selected>Bitmap</option><option value="2">Lines</option><option value="3">Metaball</option><option value="4">Metaball+</option></select></label>
      <label title="Draw the 30 Hz simulation interpolated at the display rate (the original's 60 fps option)"><input id="fps60" type="checkbox"> 60 fps</label>
      <label>Max particles <input id="particles" type="range" min="0" max="2000" step="10" value="2000"></label>
      <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
      <button id="restart" type="button">Restart level</button>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="menu" type="button">Open menu</button>
      <label>Original assets folder <input id="assets" type="file" webkitdirectory multiple></label>
    </div>
    <p>Arrow keys move; Space, Z, Shift and Control perform actions; C switches the camera between riders; Escape pauses. Choose your original assets folder for artwork and sound; files stay in your browser.</p>
    <p id="status" role="status">Starting WebGPU…</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
