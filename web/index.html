<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Wheels Rust — browser preview</title>
  <style>
    body { margin: 0; background: #242424; color: white; font: 16px system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 1rem; }
    canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #111; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin: 1rem 0; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Happy Wheels Rust — browser preview</h1>
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Game screen"></canvas>
    <div class="controls">
      <label>Load level XML <input id="level" type="file" accept=".xml,.txt,text/xml"></label>
      <label>Character <select id="character"></select></label>
      <button id="restart" type="button">Restart level</button>
      <label>Original assets folder <input id="assets" type="file" webkitdirectory multiple></label>
    </div>
    <p>Arrow keys move; Space, Z, Shift and Control perform actions. Choose your original assets folder for artwork and sound; files stay in your browser.</p>
    <p id="status" role="status">Starting WebGPU…</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
